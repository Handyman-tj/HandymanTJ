<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>&#8203;</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0a0a;font-family:system-ui,sans-serif;color:#fff}

  /* ── PIN SCREEN ── */
  #pin-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100vh;gap:16px;
  }
  #pin-screen input{
    width:220px;height:52px;text-align:center;font-size:22px;letter-spacing:8px;
    background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff;
    outline:none;caret-color:#05837F;
  }
  #pin-screen input:focus{border-color:#05837F}
  #pin-screen button{
    width:220px;height:48px;background:#05837F;border:none;border-radius:10px;
    color:#fff;font-size:16px;font-weight:600;cursor:pointer;
  }
  #pin-screen button:hover{background:#046f6b}
  #pin-err{color:#e55;font-size:13px;height:18px}

  /* ── ADMIN PANEL ── */
  #admin-panel{display:none}

  /* header */
  .adm-header{
    background:#111;border-bottom:2px solid #05837F;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .adm-title{font-size:15px;font-weight:700;color:#05837F;letter-spacing:.5px}
  .adm-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* buttons */
  .btn{padding:9px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
  .btn-teal{background:#05837F;color:#fff}
  .btn-teal:hover{background:#046f6b}
  .btn-gold{background:#EAB702;color:#111}
  .btn-gold:hover{background:#d4a800}
  .btn-ghost{background:transparent;border:1px solid #444;color:#aaa}
  .btn-ghost:hover{border-color:#666;color:#fff}
  .btn-red{background:#c0392b;color:#fff}
  .btn-red:hover{background:#a93226}

  /* setup box */
  .setup-box{
    background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;
    padding:20px;margin:20px;
  }
  .setup-box h3{font-size:14px;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
  .setup-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .setup-row input{
    flex:1;min-width:200px;padding:10px 14px;background:#111;
    border:1px solid #333;border-radius:8px;color:#fff;font-size:13px;
  }
  .setup-row input:focus{outline:none;border-color:#05837F}
  .setup-row input::placeholder{color:#555}

  /* tabs */
  .adm-tabs{display:flex;gap:6px;padding:16px 20px 0;flex-wrap:wrap}
  .adm-tab{
    padding:8px 16px;border-radius:8px 8px 0 0;border:none;
    background:#1a1a1a;color:#888;font-size:13px;font-weight:600;cursor:pointer;
  }
  .adm-tab.active{background:#05837F;color:#fff}

  /* panels */
  .adm-body{padding:20px}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  /* upload zone */
  .upload-zone{
    border:2px dashed #333;border-radius:12px;padding:40px 20px;
    text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:16px;
  }
  .upload-zone:hover,.upload-zone.drag{border-color:#05837F}
  .upload-zone p{color:#666;font-size:14px;margin-top:8px}

  /* photo grid */
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:16px}
  .photo-card{position:relative;border-radius:8px;overflow:hidden;background:#1a1a1a}
  .photo-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .photo-card .del-btn{
    position:absolute;top:4px;right:4px;width:24px;height:24px;
    background:rgba(192,57,43,.9);border:none;border-radius:50%;
    color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .photo-card .cat-label{
    position:absolute;bottom:0;left:0;right:0;
    background:rgba(0,0,0,.7);font-size:10px;color:#ccc;padding:3px 6px;
  }

  /* form rows */
  .field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field-row label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.5px}
  .field-row input,.field-row textarea,.field-row select{
    padding:10px 14px;background:#111;border:1px solid #333;
    border-radius:8px;color:#fff;font-size:13px;
  }
  .field-row textarea{resize:vertical;min-height:80px}
  .field-row input:focus,.field-row textarea:focus{outline:none;border-color:#05837F}

  /* log */
  #pub-log{
    background:#111;border:1px solid #222;border-radius:8px;padding:12px 16px;
    font-size:13px;color:#05837F;margin-top:12px;display:none;
  }

  .cat-select{
    padding:10px 14px;background:#111;border:1px solid #333;
    border-radius:8px;color:#fff;font-size:13px;width:100%;margin-bottom:10px;
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     PIN GATE — no hints, no branding
══════════════════════════════════════ -->
<div id="pin-screen">
  <input id="pin-input" type="password" maxlength="30" placeholder="••••••"
         autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="pin-err"></div>
  <button onclick="checkPin()">Enter</button>
</div>

<!-- ══════════════════════════════════════
     ADMIN PANEL (shown only after PIN)
══════════════════════════════════════ -->
<div id="admin-panel">

  <div class="adm-header">
    <span class="adm-title">Site Manager</span>
    <div class="adm-actions">
      <button class="btn btn-ghost" onclick="toggleSetup()">Connection</button>
      <button class="btn btn-ghost" onclick="copyMagicLink()">📱 Phone Link</button>
      <button class="btn btn-gold" onclick="publishAll()">Save &amp; Publish Live</button>
    </div>
  </div>

  <!-- Connection setup (hidden by default) -->
  <div class="setup-box" id="setup-box" style="display:none">
    <h3>GitHub Connection (one time)</h3>
    <div class="setup-row">
      <input id="repoOwner" placeholder="github username" value="Handyman-tj">
      <input id="repoName"  placeholder="repository"     value="HandymanTJ">
      <input id="repoBranch" placeholder="branch"        value="main" style="max-width:100px">
      <input id="ghToken" type="password" placeholder="github_pat_...">
      <button class="btn btn-teal" onclick="saveConn()">Connect</button>
      <button class="btn btn-ghost" onclick="clearConn()">Disconnect</button>
    </div>
    <p id="conn-status" style="margin-top:10px;font-size:12px;color:#888"></p>
  </div>

  <!-- Tabs -->
  <div class="adm-tabs">
    <button class="adm-tab active" onclick="showTab('photos',this)">📸 Photos</button>
    <button class="adm-tab" onclick="showTab('ba',this)">🔀 Before &amp; After</button>
    <button class="adm-tab" onclick="showTab('videos',this)">🎬 Videos</button>
    <button class="adm-tab" onclick="showTab('info',this)">📋 Info &amp; Prices</button>
  </div>

  <div class="adm-body">

    <!-- PHOTOS TAB -->
    <div class="tab-panel active" id="tab-photos">
      <select class="cat-select" id="uploadCat">
        <option value="general">General</option>
        <option value="tv-mounting">TV Mounting</option>
        <option value="painting">Painting</option>
        <option value="drywall">Drywall</option>
        <option value="flooring">Flooring</option>
        <option value="door">Door</option>
        <option value="tile">Tile</option>
        <option value="furniture">Furniture</option>
        <option value="electrical">Electrical</option>
        <option value="plumbing">Plumbing</option>
        <option value="carpentry">Carpentry</option>
        <option value="caulking">Caulking</option>
      </select>
      <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:36px">+</div>
        <p>Tap to pick photos from camera roll</p>
        <input id="fileInput" type="file" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
      </div>
      <div id="pub-log"></div>
      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <!-- BEFORE/AFTER TAB -->
    <div class="tab-panel" id="tab-ba">
      <p style="color:#888;font-size:13px;margin-bottom:16px">Upload a BEFORE and AFTER photo for each comparison.</p>
      <div id="ba-pairs"></div>
    </div>

    <!-- VIDEOS TAB -->
    <div class="tab-panel" id="tab-videos">
      <p style="color:#888;font-size:13px;margin-bottom:16px">Replace any of the 3 video reels shown on the site.</p>
      <div id="video-slots"></div>
    </div>

    <!-- INFO TAB -->
    <div class="tab-panel" id="tab-info">
      <div class="field-row">
        <label>Phone Number</label>
        <input id="info-phone" type="tel" placeholder="+1 (917) 555-0100">
      </div>
      <div class="field-row">
        <label>Service Area</label>
        <input id="info-area" placeholder="NYC, Brooklyn, Queens...">
      </div>
      <div class="field-row">
        <label>Starting Price</label>
        <input id="info-price" placeholder="From $80/hr">
      </div>
      <div class="field-row">
        <label>Special Offer / Banner Text</label>
        <input id="info-offer" placeholder="10% off this week!">
      </div>
      <button class="btn btn-gold" onclick="publishAll()">Save &amp; Publish Live</button>
    </div>

  </div><!-- /adm-body -->
</div><!-- /admin-panel -->

<script>
// ═══════════════════════════════════════════
//  PIN GATE  — PIN never stored in plaintext
//  Only the SHA-256 hash lives here
// ═══════════════════════════════════════════
const PIN_HASH = '0cffb5fa05f919ab5bef12bc13a8f46bae1218777d53a36b29c43f084e52f88d';
const SESSION_KEY = '_adm_ok';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// Auto-unlock if already verified this session
if (sessionStorage.getItem(SESSION_KEY) === '1') unlock();

// Allow Enter key on PIN input
document.getElementById('pin-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPin();
});

// Check magic link token in URL hash
(async () => {
  const hash = location.hash.slice(1);
  if (hash.startsWith('tok=')) {
    const tok = decodeURIComponent(hash.slice(4));
    const h = await sha256(tok);
    if (h === PIN_HASH) { unlock(); return; }
  }
})();

async function checkPin() {
  const val = document.getElementById('pin-input').value;
  if (!val) return;
  const h = await sha256(val);
  if (h === PIN_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    unlock();
  } else {
    const err = document.getElementById('pin-err');
    err.textContent = 'Incorrect';
    setTimeout(() => err.textContent = '', 2000);
    document.getElementById('pin-input').value = '';
  }
}

function unlock() {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  history.replaceState(null,'', location.pathname); // remove token from URL
  initAdmin();
}

// ═══════════════════════════════════════════
//  ADMIN CORE
// ═══════════════════════════════════════════
const TOKEN_KEY  = '_adm_t';
const REPO_KEY   = '_adm_r';
const stagedFiles = new Map();
let siteData = null;

function $(id){ return document.getElementById(id); }

function log(msg){
  const b = $('pub-log');
  b.style.display = 'block';
  b.textContent = msg;
}

function initAdmin() {
  // Restore saved connection
  const saved = localStorage.getItem(REPO_KEY);
  if (saved) {
    try {
      const r = JSON.parse(saved);
      $('repoOwner').value  = r.owner  || 'Handyman-tj';
      $('repoName').value   = r.repo   || 'HandymanTJ';
      $('repoBranch').value = r.branch || 'main';
      $('ghToken').value    = r.token  || '';
      $('conn-status').textContent = 'Connected ✓';
    } catch(e){}
  }
  loadSiteData();
}

function getConn(){
  return {
    owner:  $('repoOwner').value.trim()  || 'Handyman-tj',
    repo:   $('repoName').value.trim()   || 'HandymanTJ',
    branch: $('repoBranch').value.trim() || 'main',
    token:  $('ghToken').value.trim()
  };
}

function saveConn(){
  const c = getConn();
  localStorage.setItem(REPO_KEY, JSON.stringify(c));
  $('conn-status').textContent = c.token ? 'Connected ✓' : 'No token entered';
  $('setup-box').style.display = 'none';
}

function clearConn(){
  localStorage.removeItem(REPO_KEY);
  $('ghToken').value = '';
  $('conn-status').textContent = 'Disconnected';
}

function toggleSetup(){
  const b = $('setup-box');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
}

async function ghApi(path, method='GET', body=null){
  const {owner,repo,token} = getConn();
  if (!token) throw new Error('No access key — open Connection and paste your token.');
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`,{
    method,
    headers:{ Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.message||`GitHub ${r.status}`);
  return d;
}

async function loadSiteData(){
  try {
    const f = await ghApi('/contents/data/site.json');
    siteData = JSON.parse(atob(f.content.replace(/\n/g,'')));
    renderPhotos();
  } catch(e){ log('Could not load site data: '+e.message); }
}

// ── Photos ──
function renderPhotos(){
  if (!siteData) return;
  const grid = $('photoGrid');
  grid.innerHTML = '';
  (siteData.projects||[]).forEach((p,i) => {
    const c = document.createElement('div');
    c.className = 'photo-card';
    c.innerHTML = `<img src="../${p.thumb||p.full}" loading="lazy">
      <span class="cat-label">${p.category||''}</span>
      <button class="del-btn" onclick="deletePhoto(${i})" title="Remove">×</button>`;
    grid.appendChild(c);
  });
}

async function deletePhoto(idx){
  if (!siteData) return;
  if (!confirm('Remove this photo from the site?')) return;
  siteData.projects.splice(idx,1);
  renderPhotos();
  await publishSiteJson();
}

function handleFiles(files){
  Array.from(files).forEach(f => stagePhoto(f));
}

// Drag & drop
const dz = $('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); handleFiles(e.dataTransfer.files); });

async function stagePhoto(file){
  const cat = $('uploadCat').value;
  const idx = (siteData?.projects?.length||0) + stagedFiles.size + 1;
  const key = `proj-${String(idx).padStart(2,'0')}`;

  // Compress via canvas
  log(`Compressing ${file.name}…`);
  const compressed = await compressImage(file, 1400, 0.82);
  const thumb      = await compressImage(file, 640,  0.75);

  stagedFiles.set(key, { full: compressed, thumb, category: cat, name: file.name });

  // Preview in grid
  const grid = $('photoGrid');
  const url = URL.createObjectURL(compressed);
  const c = document.createElement('div');
  c.className = 'photo-card';
  c.id = `staged-${key}`;
  c.innerHTML = `<img src="${url}"><span class="cat-label">★ ${cat}</span>`;
  grid.prepend(c);
  log(`Staged: ${file.name} — click Save & Publish to go live`);
}

function compressImage(file, maxW, quality){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const cv = Object.assign(document.createElement('canvas'),{width:w,height:h});
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b => res(b), 'image/webp', quality);
    };
    img.src = URL.createObjectURL(file);
  });
}

// ── Publish ──
async function publishAll(){
  if (!siteData) { log('Not connected. Open Connection and add your token.'); return; }
  try {
    log('Publishing…');

    // Upload staged photos
    for (const [key, {full,thumb,category,name}] of stagedFiles) {
      log(`Uploading ${name}…`);
      const toB64 = b => new Promise(r => { const fr=new FileReader(); fr.onload=()=>r(fr.result.split(',')[1]); fr.readAsDataURL(b); });

      const fB64 = await toB64(full);
      const tB64 = await toB64(thumb);

      const fPath = `assets/projects/full/${key}.webp`;
      const tPath = `assets/projects/thumb/${key}.webp`;

      let fSha, tSha;
      try { fSha = (await ghApi(`/contents/${fPath}`)).sha; } catch(e){}
      try { tSha = (await ghApi(`/contents/${tPath}`)).sha; } catch(e){}

      await ghApi(`/contents/${fPath}`,'PUT',{ message:`upload ${key} full`, content:fB64, ...(fSha?{sha:fSha}:{}) });
      await ghApi(`/contents/${tPath}`,'PUT',{ message:`upload ${key} thumb`, content:tB64, ...(tSha?{sha:tSha}:{}) });

      siteData.projects.push({ id:key, thumb:`assets/projects/thumb/${key}.webp`, full:`assets/projects/full/${key}.webp`, category, title:category });
    }

    stagedFiles.clear();
    await publishSiteJson();
    log('✅ Published! Site updates in ~60 seconds.');
    renderPhotos();
  } catch(e){ log('Error: '+e.message); }
}

async function publishSiteJson(){
  const {branch} = getConn();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(siteData, null, 2))));
  const cur = await ghApi('/contents/data/site.json').catch(()=>null);
  await ghApi('/contents/data/site.json','PUT',{
    message:'site update via manager',
    content,
    branch,
    ...(cur?{sha:cur.sha}:{})
  });
}

function copyMagicLink(){
  const {token} = getConn();
  if (!token){ alert('Connect your token first.'); return; }
  const link = `${location.origin}${location.pathname}#tok=${encodeURIComponent(token)}`;
  navigator.clipboard.writeText(link).then(()=>alert('Link copied! Send to your phone.')).catch(()=>prompt('Copy this link:',link));
}

// ── Tabs ──
function showTab(id, btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.adm-tab').forEach(b=>b.classList.remove('active'));
  $('tab-'+id).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
