  let fails = 0, lockedUntil = 0;

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function b32(s) {
    const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    const cl = String(s || '').toUpperCase().replace(/[^A-Z2-7]/g, '');
    let bits = 0, v = 0, o = [];
    for (const ch of cl) {
      v = (v << 5) | a.indexOf(ch);
      bits += 5;
      if (bits >= 8) { bits -= 8; o.push((v >>> bits) & 255); }
    }
    return new Uint8Array(o);
  }

  async function totpAt(sec, off) {
    const k = await crypto.subtle.importKey('raw', b32(sec), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const ctr = Math.floor(Date.now() / 1000 / 30) + off;
    const buf = new ArrayBuffer(8);
    const dv = new DataView(buf);
    dv.setUint32(0, Math.floor(ctr / 0x100000000));
    dv.setUint32(4, ctr >>> 0);
    const sig = new Uint8Array(await crypto.subtle.sign('HMAC', k, buf));
    const ofs = sig[sig.length - 1] & 15;
    const bin = ((sig[ofs] & 127) << 24) | (sig[ofs + 1] << 16) | (sig[ofs + 2] << 8) | sig[ofs + 3];
    return String(bin % 1000000).padStart(6, '0');
  }

  async function validTotp(sec, code) {
    const c = String(code || '').trim();
    if (!/^\d{6}$/.test(c)) return false;
    for (const d of [-1, 0, 1]) {
      if ((await totpAt(sec, d)) === c) return true;
    }
    return false;
  }

  async function decryptBundle(pass) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const ak = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(S), iterations: 310000, hash: 'SHA-256' },
      km,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(I) }, ak, b64(D));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function mountConsole(bundle, pass, totp) {
    const style = document.createElement('style');
    style.textContent = bundle.css;
    document.head.appendChild(style);
    document.body.innerHTML = bundle.html;

    const $ = id => document.getElementById(id);
    const cfg = bundle.cfg;
    let siteData = null;
    let edgeReady = false;
    let sessionTok = sessionStorage.getItem('_s_tok') || '';
    const staged = new Map();

    const msg = t => {
      const b = $('statusBanner');
      b.hidden = false;
      b.textContent = t;
    };

    const ghApi = async (p, m = 'GET', body = null) => {
      if (!sessionTok) throw new Error('Enter session publish token');
      const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${p}`, {
        method: m,
        headers: { Authorization: `Bearer ${sessionTok}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.message || `HTTP ${r.status}`);
      return d;
    };

    const toB64 = blob => new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result.split(',')[1]);
      fr.readAsDataURL(blob);
    });

    const compress = (file, maxW, q) => new Promise(res => {
      const im = new Image();
      im.onload = () => {
        const sc = Math.min(1, maxW / im.width);
        const w = Math.round(im.width * sc), h = Math.round(im.height * sc);
        const cv = Object.assign(document.createElement('canvas'), { width: w, height: h });
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        cv.toBlob(b => res(b), 'image/webp', q);
      };
      im.src = URL.createObjectURL(file);
    });

    const renderAll = () => {
      if (!siteData) return;
      const g = $('pGrid');
      g.innerHTML = '';
      (siteData.projects || []).forEach((p, i) => {
        const d = document.createElement('div');
        d.className = 'pcard';
        d.innerHTML = `<img src="../${p.thumb || p.full}" loading="lazy"><button class="pdel" data-del="${i}" type="button">&times;</button><div class="pcap">${p.category || ''} · ${p.title || ''}</div>`;
        g.appendChild(d);
      });
      g.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        if (!confirm('Remove photo from site?')) return;
        siteData.projects.splice(Number(b.dataset.del), 1);
        renderAll();
        msg('Removed locally — press Save & Publish Live to apply.');
      }));

      $('fPromoBanner').value = siteData.promo?.bannerText || '';
      $('fPromoTitle').value = siteData.promo?.ctaTitle || '';
      $('fPromoSub').value = siteData.promo?.ctaSubtitle || '';
      $('fPhone').value = siteData.brand?.phoneDisplay || '';
      $('fPhoneE164').value = siteData.brand?.phoneE164 || '';
      $('fEmail').value = siteData.brand?.email || '';
      $('fAddr').value = siteData.brand?.address || '';
      $('fHours').value = siteData.brand?.hoursSummary || '';
      $('fProjCount').value = siteData.brand?.projectsDone || '';
      $('fCliCount').value = siteData.brand?.clientsCount || '';
      $('fRatingVal').value = siteData.brand?.ratingValue || '5.0';
      $('fRatingCnt').value = siteData.brand?.reviewCount || '16';
      $('shareGoogleUrl').value = siteData.brand?.googleReviewUrl || '';

      const sl = $('svcList');
      sl.innerHTML = '';
      (siteData.services || []).forEach((sv, idx) => {
        const row = document.createElement('div');
        row.className = 'svc-row';
        row.innerHTML = `<div style="flex:1;min-width:200px"><strong>${sv.title}</strong><div style="font-size:12px;color:#94a3b8">${sv.description}</div></div><input type="text" data-svcp="${idx}" value="${sv.priceNote || 'Free Quote'}" style="width:140px;padding:8px;background:#0f141b;border:1px solid #334155;border-radius:6px;color:#fff">`;
        sl.appendChild(row);
      });

      const rl = $('revAdminList');
      rl.innerHTML = '';
      (siteData.testimonials || []).forEach((rv, idx) => {
        const row = document.createElement('div');
        row.className = 'rev-row';
        row.innerHTML = `<div style="flex:1"><strong>${rv.name}</strong> (${rv.location})<div style="font-size:12px;color:#94a3b8">${rv.text}</div></div><button type="button" class="abtn abtn-ghost" data-rdel="${idx}">Remove</button>`;
        rl.appendChild(row);
      });
      rl.querySelectorAll('[data-rdel]').forEach(b => b.addEventListener('click', () => {
        siteData.testimonials.splice(Number(b.dataset.rdel), 1);
        renderAll();
      }));
    };

    const loadData = async () => {
      if (edgeReady) {
        try {
          msg('Loading live config from edge...');
          const freshCode = $('c')?.value || totp;
          const r = await fetch('/api/load', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ auth: { passphrase: pass, totp: freshCode } })
          });
          if (r.ok) {
            const d = await r.json();
            siteData = d.siteData;
            renderAll();
            msg('Edge connected — ready to publish without GitHub token.');
            return;
          }
        } catch {}
      }
      if (sessionTok) {
        try {
          const f = await ghApi(`/contents/data/site.json?ref=${cfg.branch}`);
          siteData = JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g, '')))));
          renderAll();
          msg('Loaded via session key.');
          return;
        } catch (e) { msg(e.message); }
      }
      try {
        const r = await fetch('../data/site.json', { cache: 'no-cache' });
        siteData = await r.json();
        renderAll();
        msg('Loaded read-only preview. Connect Session Key to publish.');
      } catch (e) { msg('Load failed'); }
    };

    document.querySelectorAll('.atab').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.atab').forEach(x => x.classList.remove('on'));
      document.querySelectorAll('.apanel').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      $('panel-' + b.dataset.t).classList.add('on');
    }));

    const db = $('dropBox'), fp = $('filePick');
    db.addEventListener('click', () => fp.click());
    db.addEventListener('dragover', e => { e.preventDefault(); db.classList.add('drag'); });
    db.addEventListener('dragleave', () => db.classList.remove('drag'));
    const queueFiles = async files => {
      for (const file of files) {
        const cat = $('upCat').value;
        const loc = $('upLoc').value.trim() || 'NYC';
        const title = $('upTitle').value.trim() || cat;
        const id = `proj-${Date.now().toString(36)}`;
        msg(`Compressing ${file.name}...`);
        const [full, thumb] = await Promise.all([compress(file, 1400, 0.82), compress(file, 640, 0.75)]);
        staged.set(id, { id, full, thumb, category: cat, location: loc, title });
        const d = document.createElement('div');
        d.className = 'pcard';
        d.innerHTML = `<img src="${URL.createObjectURL(thumb)}"><div class="pcap">★ ${cat} · ${title}</div>`;
        $('pGrid').prepend(d);
      }
      msg(`${staged.size} photo(s) queued — press Save & Publish Live.`);
    };
    fp.addEventListener('change', e => queueFiles(e.target.files));
    db.addEventListener('drop', e => { e.preventDefault(); db.classList.remove('drag'); queueFiles(e.dataTransfer.files); });

    $('btnToggleConn').addEventListener('click', () => { $('connDrawer').hidden = !$('connDrawer').hidden; });
    $('btnSaveSessionTok').addEventListener('click', () => {
      sessionTok = $('sessionTok').value.trim();
      if (sessionTok) sessionStorage.setItem('_s_tok', sessionTok);
      $('connDrawer').hidden = true;
      loadData();
    });

    $('btnCopyFunnel').addEventListener('click', () => navigator.clipboard.writeText($('shareFunnelUrl').value).then(() => msg('Review funnel link copied!')));
    $('btnCopyGoogle').addEventListener('click', () => navigator.clipboard.writeText($('shareGoogleUrl').value).then(() => msg('Google review link copied!')));

    $('btnAddRev').addEventListener('click', () => {
      const name = $('nrName').value.trim(), text = $('nrText').value.trim();
      if (!name || !text || !siteData) return;
      siteData.testimonials.unshift({
        name,
        location: $('nrLoc').value.trim() || 'New York, NY',
        source: 'Google Review',
        date: $('nrDate').value.trim() || 'Nov 2026',
        rating: 5,
        text
      });
      $('nrName').value = ''; $('nrText').value = '';
      renderAll();
      msg('Review added — click Save & Publish Live.');
    });

    $('btnPublishAll').addEventListener('click', async () => {
      if (!siteData) return;
      siteData.promo.bannerText = $('fPromoBanner').value;
      siteData.promo.ctaTitle = $('fPromoTitle').value;
      siteData.promo.ctaSubtitle = $('fPromoSub').value;
      siteData.brand.phoneDisplay = $('fPhone').value;
      siteData.brand.phoneE164 = $('fPhoneE164').value;
      siteData.brand.email = $('fEmail').value;
      siteData.brand.address = $('fAddr').value;
      siteData.brand.hoursSummary = $('fHours').value;
      siteData.brand.projectsDone = $('fProjCount').value;
      siteData.brand.clientsCount = $('fCliCount').value;
      siteData.brand.ratingValue = $('fRatingVal').value;
      siteData.brand.reviewCount = $('fRatingCnt').value;
      document.querySelectorAll('[data-svcp]').forEach(inp => {
        const s = siteData.services[Number(inp.dataset.svcp)];
        if (s) s.priceNote = inp.value;
      });

      const uploads = [];
      for (const [, item] of staged) {
        const [fB64, tB64] = await Promise.all([toB64(item.full), toB64(item.thumb)]);
        uploads.push({ path: `assets/projects/full/${item.id}.webp`, base64: fB64 });
        uploads.push({ path: `assets/projects/thumb/${item.id}.webp`, base64: tB64 });
        siteData.projects.unshift({
          id: item.id,
          title: item.title,
          category: item.category,
          location: item.location,
          thumb: `assets/projects/thumb/${item.id}.webp`,
          full: `assets/projects/full/${item.id}.webp`
        });
      }

      try {
        msg('Publishing live...');
        if (edgeReady) {
          const freshTotp = await totpAt(cfg.totpSecret, 0);
          const r = await fetch('/api/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ auth: { passphrase: pass, totp: freshTotp }, uploads, siteData })
          });
          const res = await r.json();
          if (!r.ok) throw new Error(res.error || 'Edge publish error');
        } else {
          if (!sessionTok) { $('connDrawer').hidden = false; throw new Error('Enter session publish token above.'); }
          for (const u of uploads) {
            let sha; try { sha = (await ghApi(`/contents/${u.path}?ref=${cfg.branch}`)).sha; } catch {}
            await ghApi(`/contents/${u.path}`, 'PUT', { message: `upload ${u.path}`, content: u.base64, branch: cfg.branch, ...(sha ? { sha } : {}) });
          }
          const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(siteData, null, 2))));
          const cur = await ghApi(`/contents/data/site.json?ref=${cfg.branch}`).catch(() => null);
          await ghApi('/contents/data/site.json', 'PUT', {
            message: 'site update',
            content: contentB64,
            branch: cfg.branch,
            ...(cur ? { sha: cur.sha } : {})
          });
        }
        staged.clear();
        renderAll();
        msg('Published cleanly! Updates go live within 60 seconds.');
      } catch (e) {
        msg('Publish error: ' + e.message);
      }
    });

    (async () => {
      try {
        const sr = await fetch('/api/status', { cache: 'no-store' });
        if (sr.ok) {
          const st = await sr.json();
          edgeReady = Boolean(st.edgeReady);
        }
      } catch {}
      $('edgeModeBadge').textContent = edgeReady ? 'Cloudflare Edge Secured' : 'Session Mode';
      $('btnToggleConn').hidden = edgeReady;
      await loadData();
    })();
  }

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const now = Date.now();
    if (now < lockedUntil) return;
    const f = document.getElementById('f');
    const s = document.getElementById('s');
    const pass = document.getElementById('p').value;
    const code = document.getElementById('c').value.trim();
    f.classList.remove('bad');
    s.disabled = true;
    try {
      const bundle = await decryptBundle(pass);
      const ok = await validTotp(bundle.cfg.totpSecret, code);
      if (!ok) throw new Error();
      mountConsole(bundle, pass, code);
    } catch {
      fails++;
      f.classList.add('bad');
      document.getElementById('p').value = '';
      document.getElementById('c').value = '';
      if (fails >= 5) {
        lockedUntil = Date.now() + 30000;
        setTimeout(() => { s.disabled = false; fails = 0; }, 30000);
        return;
      }
    }
    s.disabled = false;
  });
})();
</script>
</body>
</html>
